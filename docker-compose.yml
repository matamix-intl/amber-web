services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-amber_web}
      MYSQL_USER: ${DB_USER:-amber}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-amber_web}
      WORDPRESS_DB_USER: ${DB_USER:-amber}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX:-wp_}
      # Salts come from .env — generate at https://api.wordpress.org/secret-key/1.1/salt/
      WORDPRESS_AUTH_KEY: ${AUTH_KEY:?set AUTH_KEY in .env}
      WORDPRESS_SECURE_AUTH_KEY: ${SECURE_AUTH_KEY:?set SECURE_AUTH_KEY in .env}
      WORDPRESS_LOGGED_IN_KEY: ${LOGGED_IN_KEY:?set LOGGED_IN_KEY in .env}
      WORDPRESS_NONCE_KEY: ${NONCE_KEY:?set NONCE_KEY in .env}
      WORDPRESS_AUTH_SALT: ${AUTH_SALT:?set AUTH_SALT in .env}
      WORDPRESS_SECURE_AUTH_SALT: ${SECURE_AUTH_SALT:?set SECURE_AUTH_SALT in .env}
      WORDPRESS_LOGGED_IN_SALT: ${LOGGED_IN_SALT:?set LOGGED_IN_SALT in .env}
      WORDPRESS_NONCE_SALT: ${NONCE_SALT:?set NONCE_SALT in .env}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
    volumes:
      # User uploads persist across rebuilds; site code lives in the image.
      - uploads:/var/www/html/wp-content/uploads

volumes:
  db_data:
  uploads:
