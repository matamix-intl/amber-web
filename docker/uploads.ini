; PHP limits for the Amber WordPress container.
; post_max_size must be >= upload_max_filesize or uploads fail silently.

file_uploads = On
upload_max_filesize = 400M
post_max_size = 400M
memory_limit = 512M

max_execution_time = 600
max_input_time = 600

; Page-builder (ACF) edit screens submit many input variables; PHP discards
; everything past this cap, and mod_php ignores .user.ini.
max_input_vars = 10000

upload_tmp_dir = /tmp

; Keep errors in the log, not in the response body.
display_errors = Off
log_errors = On
error_log = /dev/stderr
