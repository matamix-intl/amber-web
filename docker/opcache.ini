; Opcache tuning. WordPress loads several hundred PHP files per request.

opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Keep checking timestamps (plugin/theme updates from wp-admin), but at most
; every 2s rather than on every request.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

opcache.save_comments=1
