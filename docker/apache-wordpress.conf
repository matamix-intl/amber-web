# Silences the "could not reliably determine the server's FQDN" warning.
ServerName localhost

# Alpine's httpd.conf serves /var/www/localhost/htdocs with AllowOverride None,
# which makes Apache ignore .htaccess and breaks permalinks and the WebP
# rewrite. Point it at /var/www/html and re-enable overrides there.
DocumentRoot /var/www/html
DirectoryIndex index.php index.html

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# No body-size cap in Apache; PHP's post_max_size (400M) is the real limit.
LimitRequestBody 0

# Never serve config, dumps or logs, even if something copies them in.
<FilesMatch "^(wp-config\.php|wp-config-docker\.php|\.env|.*\.sql|.*\.log|\.user\.ini)$">
    Require all denied
</FilesMatch>
